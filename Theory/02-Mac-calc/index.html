<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mac Calculator</title>
    <link rel="stylesheet" href="styles.css">

</head>
<body>

    <main class="calculator">

        <!-- Calculator Header -->
        <header class="calculator__header">

            <!-- macOS window controls -->
            <div class="window-controls">
                <span class="window-control window-control--close"></span>
                <span class="window-control window-control--minimize"></span>
                <span class="window-control window-control--maximize"></span>
            </div>

            <!-- Calculator mode icon -->
            <div class="calculator-mode">
                <span class="calculator-mode__icon">▦</span>
            </div>

        </header>


        <!-- Calculator Display -->
        <section class="calculator__display">
            <output
                id="display"
                class="display"
                aria-live="polite">
                0
            </output>
        </section>


        <!-- Calculator Buttons -->
        <section
            class="calculator__keys"
            aria-label="Calculator">

            <!-- Row 1 -->
            <button
                class="key key--function"
                data-action="clear">
                AC
            </button>

            <button
                class="key key--function"
                data-action="sign">
                +/−
            </button>

            <button
                class="key key--function"
                data-action="percent">
                %
            </button>

            <button
                class="key key--operator"
                data-operator="/">
                ÷
            </button>


            <!-- Row 2 -->
            <button class="key key--number" data-number="7">
                7
            </button>

            <button class="key key--number" data-number="8">
                8
            </button>

            <button class="key key--number" data-number="9">
                9
            </button>

            <button
                class="key key--operator"
                data-operator="*">
                ×
            </button>


            <!-- Row 3 -->
            <button class="key key--number" data-number="4">
                4
            </button>

            <button class="key key--number" data-number="5">
                5
            </button>

            <button class="key key--number" data-number="6">
                6
            </button>

            <button
                class="key key--operator"
                data-operator="-">
                −
            </button>


            <!-- Row 4 -->
            <button class="key key--number" data-number="1">
                1
            </button>

            <button class="key key--number" data-number="2">
                2
            </button>

            <button class="key key--number" data-number="3">
                3
            </button>

            <button
                class="key key--operator"
                data-operator="+">
                +
            </button>


            <!-- Row 5 -->
            <button
                class="key key--function"
                data-action="sign">
                +/−
            </button>

            <button class="key key--number" data-number="0">
                0
            </button>

            <button
                class="key key--number"
                data-action="decimal">
                .
            </button>

            <button
                class="key key--operator"
                data-action="equals">
                =
            </button>

        </section>

    </main>


    <script type="module" src="app.js"></script>
    <!-- 
        type = "module" 
        This tells the browser treat this JS file as an ES module
    -->

</body>
</html>
